<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle (Soccer Ball Base) -->
  <circle cx="50" cy="50" r="46" fill="url(#ballGrad)" stroke="#0f172a" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Central Black Pentagon -->
  <polygon points="50,32 66,44 60,63 40,63 34,44" fill="#0f172a" />
  
  <!-- Outer Pentagon Patches -->
  <!-- Top -->
  <polygon points="50,4 40,16 60,16" fill="#0f172a" />
  <line x1="50" y1="32" x2="50" y2="16" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  
  <!-- Top Right -->
  <polygon points="88,24 74,27 82,41" fill="#0f172a" />
  <line x1="66" y1="44" x2="74" y2="27" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  
  <!-- Bottom Right -->
  <polygon points="88,76 74,73 82,59" fill="#0f172a" />
  <line x1="60" y1="63" x2="74" y2="73" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  
  <!-- Bottom Left -->
  <polygon points="12,76 26,73 18,59" fill="#0f172a" />
  <line x1="40" y1="63" x2="26" y2="73" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  
  <!-- Top Left -->
  <polygon points="12,24 26,27 18,41" fill="#0f172a" />
  <line x1="34" y1="44" x2="26" y2="27" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
</svg>
